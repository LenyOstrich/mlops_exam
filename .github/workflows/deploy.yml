name: CI_CD_ML_System

on:
  push:
    branches:
      - main

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run training sanity check
        run: python app/train.py

      - name: Run evaluation sanity check
        run: python -c "from app.evaluate import evaluate; print(evaluate())"

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build and start full ML system
        run: |
          docker compose -f infrastructure/docker-compose.yml up -d --build

      - name: Wait for API healthcheck
        run: |
          sleep 15
          curl -f http://localhost:8000/health

      - name: Show running containers
        run: docker ps

      - name: Show logs (debug if needed)
        if: failure()
        run: docker compose -f infrastructure/docker-compose.yml logs